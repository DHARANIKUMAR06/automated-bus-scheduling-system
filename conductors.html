<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTC - Conductor Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-bus-front-fill" style="font-size: 2.2rem; color: var(--primary-color)"></i>
            <h3>DTC Management</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="/buses.html"><i class="bi bi-truck"></i> Bus Fleet</a></li>
            <li><a href="/drivers.html"><i class="bi bi-person-badge"></i> Drivers</a></li>
            <li class="active"><a href="/conductors.html"><i class="bi bi-people"></i> Conductors</a></li>
            <li><a href="/routes.html"><i class="bi bi-map"></i> Route Details</a></li>
            <li><a href="/schedules.html"><i class="bi bi-calendar3"></i> Schedule Planner</a></li>
            <li><a href="/trips.html"><i class="bi bi-play-circle"></i> Live Trips</a></li>
            <li><a href="/maintenance.html"><i class="bi bi-tools"></i> Maintenance</a></li>
            <li><a href="/reports.html"><i class="bi bi-file-earmark-bar-graph"></i> Report Center</a></li>
            <li><a href="/settings.html"><i class="bi bi-gear"></i> Settings</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar" id="profile-avatar-letter">A</div>
                <div class="user-details">
                    <div class="user-name" id="profile-user-name">Admin User</div>
                    <div class="user-role" id="profile-user-role">Administrator</div>
                </div>
                <a href="#" onclick="logoutUser()" title="Logout" style="color: rgba(255,255,255,0.6)"><i class="bi bi-power" style="font-size: 1.2rem"></i></a>
            </div>
        </div>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <div class="topbar">
            <div class="page-title">
                <h4>Conductor Registry</h4>
            </div>
            <div class="topbar-actions">
                <div class="theme-toggle" id="theme-toggle-btn" title="Toggle Theme">
                    <i class="bi bi-moon-fill"></i>
                </div>
            </div>
        </div>

        <!-- Content Body -->
        <div class="content-body">
            <div class="glass-panel animated-fade">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <div class="d-flex align-items-center gap-2">
                        <input type="text" id="search-conductor-input" class="form-control form-control-custom" style="width: 250px;" placeholder="Search by name or employee ID...">
                        <button class="btn btn-primary-custom" onclick="loadConductors()"><i class="bi bi-search"></i> Search</button>
                    </div>
                    <button class="btn btn-primary-custom" id="add-conductor-btn" data-bs-toggle="modal" data-bs-target="#conductorModal" onclick="openCreateModal()"><i class="bi bi-plus-lg"></i> Add New Conductor</button>
                </div>

                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Employee ID</th>
                                <th>Status</th>
                                <th>Depot</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="conductor-table-body">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Conductor Save/Edit Modal -->
    <div class="modal fade" id="conductorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="conductorModalTitle">Add New Conductor</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="conductor-form">
                    <input type="hidden" id="conductor-id">
                    <div class="modal-body">
                        <!-- User account creation fields (only visible during creation) -->
                        <div id="credentials-section">
                            <div class="mb-3">
                                <label for="conductor-username" class="form-label">Username (For Portal Login)</label>
                                <input type="text" class="form-control form-control-custom" id="conductor-username" placeholder="e.g. ramesh_c" required>
                            </div>
                            <div class="mb-3">
                                <label for="conductor-password" class="form-label">Temporary Password</label>
                                <input type="password" class="form-control form-control-custom" id="conductor-password" placeholder="Min 6 characters">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="conductor-name" class="form-label">Full Name</label>
                            <input type="text" class="form-control form-control-custom" id="conductor-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="conductor-employee-id" class="form-label">Employee ID</label>
                            <input type="text" class="form-control form-control-custom" id="conductor-employee-id" placeholder="e.g. EMP-CON-1234" required>
                        </div>
                        <div class="mb-3">
                            <label for="conductor-email" class="form-label">Email</label>
                            <input type="email" class="form-control form-control-custom" id="conductor-email">
                        </div>
                        <div class="mb-3">
                            <label for="conductor-phone" class="form-label">Phone</label>
                            <input type="text" class="form-control form-control-custom" id="conductor-phone">
                        </div>
                        <div class="mb-3">
                            <label for="conductor-status" class="form-label">Status</label>
                            <select class="form-select form-control-custom" id="conductor-status" required>
                                <option value="AVAILABLE">AVAILABLE</option>
                                <option value="ON_TRIP">ON TRIP</option>
                                <option value="LEAVE">LEAVE</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="conductor-depot" class="form-label">Assigned Depot</label>
                            <select class="form-select form-control-custom" id="conductor-depot" required>
                                <option value="1">Rajghat Depot-I</option>
                                <option value="2">Indraprastha Depot</option>
                                <option value="3">Sukhdev Vihar Depot</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary text-white" style="background: var(--text-secondary); border: none" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom">Save Conductor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API JS -->
    <script src="/js/api.js"></script>
    <!-- Conductors Script -->
    <script src="/js/conductors.js"></script>
</body>
</html>
