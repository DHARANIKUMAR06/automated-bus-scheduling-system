# Server Configuration
server.port=8080

# Database Configuration (H2 In-Memory with MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:dtc_bus_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Database initialization (disabled — seeded by DataInitializer.java bean on startup)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT Configuration
# 256-bit secret key (Base64 encoded or raw string)
dtc.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
dtc.jwtExpirationMs=86400000

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Static Content Configuration
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.dtc.busmanagement=DEBUG

# Enable Console Color Logs
spring.output.ansi.enabled=ALWAYS
